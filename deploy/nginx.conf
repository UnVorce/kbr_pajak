# Reverse proxy KBR Pajak API.
# /reason rata-rata ~5,5 detik (maks ~6,1 detik), jadi timeout default 60s terlalu mepet.

upstream kbr_api {
    server api:8000;
    keepalive 32;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 1m;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";

    gzip on;
    gzip_types application/json;
    gzip_min_length 1024;

    # Healthcheck: jangan pernah di-cache dan jangan masuk access log.
    location = /api/health {
        proxy_pass http://kbr_api/api/health;
        access_log off;
    }

    # Swagger/OpenAPI untuk tim frontend.
    location ~ ^/(docs|redoc|openapi\.json)$ {
        proxy_pass http://kbr_api;
        proxy_read_timeout 30s;
    }

    location / {
        proxy_pass http://kbr_api;
        proxy_connect_timeout 5s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }
}
